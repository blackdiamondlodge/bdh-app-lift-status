[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-lift-status"
version = "1.0.1"
description = "Black Diamond Hub app: Sun Peaks lift and trail status"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk>=0.1,<1",
    "beautifulsoup4",
    "requests",
]

[project.urls]
Source = "https://github.com/blackdiamondlodge/bdh-app-lift-status"

[project.entry-points."blackdiamondhub.plugins"]
lift_status = "lift_status.plugin:spec"

[tool.setuptools.packages.find]
include = ["lift_status", "lift_status.*"]

[tool.setuptools.package-data]
lift_status = [
    "templates/**/*",
    "static/**/*",
    "migrations/*.py",
]
